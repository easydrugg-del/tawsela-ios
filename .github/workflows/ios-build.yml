name: ios-build

# بناء نسخة iOS على Mac سحابي — يعمل بدون جهاز Mac محلي.
# الناتج: Tawsela.app للمحاكي (غير موقّع) يمكن تثبيته على أي محاكي iOS.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'صورة macOS (xcode-27 لأن .NET iOS 27.1 يتطلب Xcode 27.1)'
        required: false
        default: 'xcode-27'
      dotnet:
        description: 'إصدار .NET SDK'
        required: false
        default: '10.0.x'
  push:
    branches: [ main, master ]
    paths:
      - 'Tawsela.Core/**'
      - 'Tawsela.iOS/**'
      - 'Assets/leaflet/**'
      - 'Resources/drawable/**'
      - '.github/workflows/ios-build.yml'

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  simulator:
    name: Build for iOS Simulator
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode:"
          ls -d /Applications/Xcode*.app || true
          # .NET iOS 27.1 يتطلب Xcode 27.1 بالتحديد — لا نختار الأحدث تلقائيًا
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      # global.json في المستودع يثبّت SDK 11 preview (للتطوير المحلي على ويندوز)،
      # وهذا الـ runner يثبّت .NET 10 المستقر — لذلك نتجاوزه في CI فقط.
      # يجب أن يكون هذا قبل أي أمر dotnet (بما فيه workload install).
      - name: Use the runner SDK
        run: rm -f global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet || '10.0.x' }}

      - name: Show SDK
        run: dotnet --version

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore
        run: dotnet restore Tawsela.iOS/Tawsela.iOS.csproj -r iossimulator-arm64

      - name: Build (simulator, unsigned)
        run: |
          dotnet build Tawsela.iOS/Tawsela.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r iossimulator-arm64 \
            -m:1 -nr:false \
            -p:EnableCodeSigning=false \
            -p:EnableFirebase=false

      - name: Verify app bundle
        run: |
          APP="Tawsela.iOS/bin/Release/net10.0-ios/iossimulator-arm64/Tawsela.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          echo "Device family (1=iPhone, 2=iPad):"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist" || true
          echo "ATS keys (يجب ألا يظهر NSAllowsArbitraryLoads):"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$APP/Info.plist" || echo "none"
          echo "App icon has alpha channel?"
          ICON="$(find "$APP" -name 'AppIcon60x60@2x.png' | head -1)"
          if [ -n "$ICON" ]; then sips -g hasAlpha "$ICON"; fi
          du -sh "$APP"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Tawsela-simulator-${{ github.run_number }}
          # النجمة ضرورية: بدونها يفقد الـ Artifact اسم مجلد Tawsela.app
          path: Tawsela.iOS/bin/Release/net10.0-ios/iossimulator-arm64/*.app
          if-no-files-found: error
          retention-days: 14

      # تشغيل التطبيق فعليًا على محاكي iOS وتصويره — أقرب بديل عن وجود Mac
      - name: Run in simulator and capture screenshots
        run: |
          set -x
          APP="Tawsela.iOS/bin/Release/net10.0-ios/iossimulator-arm64/Tawsela.app"
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|test("iPhone"))][0].udid')
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots

          # تشغيل مع التقاط stdout/stderr (فيه أي استثناء مُدار)
          xcrun simctl launch --console "$UDID" com.tawsela.app > screenshots/console.txt 2>&1 &
          LAUNCH_PID=$!
          sleep 20
          kill $LAUNCH_PID 2>/dev/null || true

          # هل العملية لسه شغالة؟
          xcrun simctl spawn "$UDID" launchctl list > screenshots/launchctl.txt 2>&1 || true
          if grep -qi tawsela screenshots/launchctl.txt; then
            echo "APP STILL RUNNING"
          else
            echo "APP NOT RUNNING (crashed or exited)" | tee screenshots/app-crashed.txt
          fi

          xcrun simctl io "$UDID" screenshot screenshots/01-splash.png || true
          sleep 10
          xcrun simctl io "$UDID" screenshot screenshots/02-after.png || true

          # سجلات النظام + تقارير الانهيار
          xcrun simctl spawn "$UDID" log show --last 4m --style compact \
            --predicate 'eventMessage CONTAINS[c] "tawsela"' > screenshots/log.txt 2>&1 || true
          mkdir -p screenshots/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips screenshots/crashes/ 2>/dev/null || true
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tawsela-screenshots-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            Tawsela.iOS/obj/**/*.log
            Tawsela.iOS/bin/**/*.log
          if-no-files-found: ignore
          retention-days: 7
